<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Πλακωτό - Project</title>
    
    <link rel="stylesheet" href="css/backgammon.css">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/plakoto.js"></script>
</head>
<body>

    <h1 style="text-align:center;">Πλακωτό</h1>

    <div id="backgammon_board">
        <div id="visual_board">
            <div class="quadrant top-left">
                <div class="board-slot top" id="pos_13"></div>
                <div class="board-slot top" id="pos_14"></div>
                <div class="board-slot top" id="pos_15"></div>
                <div class="board-slot top" id="pos_16"></div>
                <div class="board-slot top" id="pos_17"></div>
                <div class="board-slot top" id="pos_18"></div>
            </div>
            <div class="quadrant top-right">
                <div class="board-slot top" id="pos_19"></div>
                <div class="board-slot top" id="pos_20"></div>
                <div class="board-slot top" id="pos_21"></div>
                <div class="board-slot top" id="pos_22"></div>
                <div class="board-slot top" id="pos_23"></div>
                <div class="board-slot top" id="pos_24"></div>
            </div>
            <div class="quadrant bottom-left">
                <div class="board-slot bottom" id="pos_12"></div>
                <div class="board-slot bottom" id="pos_11"></div>
                <div class="board-slot bottom" id="pos_10"></div>
                <div class="board-slot bottom" id="pos_9"></div>
                <div class="board-slot bottom" id="pos_8"></div>
                <div class="board-slot bottom" id="pos_7"></div>
            </div>
            <div class="quadrant bottom-right">
                <div class="board-slot bottom" id="pos_6"></div>
                <div class="board-slot bottom" id="pos_5"></div>
                <div class="board-slot bottom" id="pos_4"></div>
                <div class="board-slot bottom" id="pos_3"></div>
                <div class="board-slot bottom" id="pos_2"></div>
                <div class="board-slot bottom" id="pos_1"></div>
            </div>
        </div>
    </div>

    <div style="text-align:center; margin-top:20px; padding: 20px; background: #f0f0f0; border: 1px solid #ccc;">
        
        <h3>Πίνακας Ελέγχου</h3>
        
        <div style="margin-bottom: 20px;">
            <input type="text" id="username" placeholder="Όνομα Χρήστη">
            <select id="pcolor">
                <option value="W">Λευκά (W)</option>
                <option value="B">Μαύρα (B)</option>
            </select>
            <button id="plakoto_login">Σύνδεση (Login)</button>
        </div>
        
        <hr style="width: 50%;">
        
        <div style="margin: 20px 0;">
            <label>Από Θέση:</label>
            <input type="number" id="src" min="1" max="24" style="width:50px"> 
            
            <label>Σε Θέση:</label>
            <input type="number" id="dest" min="1" max="24" style="width:50px">
            
            <button id="do_move" style="font-weight:bold; padding: 5px 15px;">Κίνηση</button>
        </div>

        <hr style="width: 50%;">

        <button id="plakoto_reset" style="background:darkred; color:white; border:none; padding:10px;">
            Επανεκκίνηση Παιχνιδιού (Reset)
        </button>

    </div>

</body>
</html>
