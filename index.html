<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Plakoto Online Multiplayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="setup-modal" class="modal">
        <div class="modal-content">
            <h2>🎲 Plakoto Online</h2>
            <p>Παίξε με φίλο από άλλο υπολογιστή</p>
            
            <hr style="width:100%; border:0; border-top:1px solid #555;">

            <button onclick="createGame()" style="background:#27ae60;">Δημιουργία Νέου (Είμαι ο Host)</button>
            
            <p>- Ή -</p>

            <input type="number" id="join-id" placeholder="ID Παιχνιδιού (π.χ. 1)" style="text-align:center;">
            <button onclick="joinGame()" style="background:#2980b9;">Σύνδεση σε υπάρχον</button>
        </div>
    </div>

    <div id="game-ui" style="display:none; height: 100%;">
        
        <div class="header-info">
            <div style="text-align:left;">
                <span id="my-role-badge" style="background:#555; padding:2px 5px; font-size:12px; border-radius:3px;">ΘΕΑΤΗΣ</span>
                <br>
                <strong id="turn-indicator">Αναμονή...</strong>
            </div>

            <span id="message-area" style="color: #f1c40f; font-weight: bold; font-size:14px;"></span>

            <div style="display: flex; gap: 5px; align-items:center;">
                <button id="btn-roll" onclick="rollDice()">🎲 Ζάρια</button>
                <span id="die1" class="die">-</span>
                <span id="die2" class="die">-</span>
            </div>
            
            <div style="font-size:12px; color:#aaa;">
                Game ID: <strong id="display-game-id" style="color:white; font-size:14px;">-</strong>
            </div>
        </div>

        <div class="board-wrapper">
            <div class="board" id="board-container">
                <div class="half-board top">
                    <div class="point" id="pos-13"></div><div class="point" id="pos-14"></div><div class="point" id="pos-15"></div><div class="point" id="pos-16"></div><div class="point" id="pos-17"></div><div class="point" id="pos-18"></div><div class="point" id="pos-19"></div><div class="point" id="pos-20"></div><div class="point" id="pos-21"></div><div class="point" id="pos-22"></div><div class="point" id="pos-23"></div><div class="point" id="pos-24"></div>
                </div>
                <div class="half-board bottom">
                    <div class="point" id="pos-12"></div><div class="point" id="pos-11"></div><div class="point" id="pos-10"></div><div class="point" id="pos-9"></div><div class="point" id="pos-8"></div><div class="point" id="pos-7"></div><div class="point" id="pos-6"></div><div class="point" id="pos-5"></div><div class="point" id="pos-4"></div><div class="point" id="pos-3"></div><div class="point" id="pos-2"></div><div class="point" id="pos-1"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
